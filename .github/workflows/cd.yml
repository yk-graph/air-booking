name: CD

on:
  push:
    branches:
      - staging
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & push image
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve image tag
        id: meta
        run: echo "tag=${{ github.ref_name == 'main' && 'latest' || 'staging' }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: true
          tags: ghcr.io/yk-graph/air-booking-web:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Mac mini
    needs: build
    runs-on: [self-hosted, macOS, ARM64, air-booking]

    steps:
      - name: Deploy
        run: |
          cd ~/server/srv/air-booking
          git fetch origin

          if [ "${{ github.ref_name }}" = "staging" ]; then
            git switch staging
            git pull origin staging
            docker compose -f docker-compose.stg.yml pull
            docker compose -f docker-compose.stg.yml up -d
          elif [ "${{ github.ref_name }}" = "main" ]; then
            git switch main
            git pull origin main
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
          fi

      - name: Clean up dangling images
        run: docker image prune -f
