name: air-booking-dev

services:
  db-dev:
    image: mysql:8.4
    container_name: air-booking-dev-db
    ports:
      - '3306:3306'
    environment:
      - MYSQL_ROOT_PASSWORD=password
      - MYSQL_DATABASE=air_booking
    volumes:
      - air-booking-dev-mysql-data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-ppassword']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  air-booking-dev-mysql-data:
    name: air-booking-dev-mysql-data
