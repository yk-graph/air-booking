name: air-booking-stg

services:
  db-stg:
    image: mysql:8.4
    container_name: air-booking-db-stg
    ports:
      - '127.0.0.1:4219:3306'
    env_file:
      - .env.staging
    environment:
      - MYSQL_DATABASE=air_booking
    volumes:
      - air-booking-stg-mysql-data:/var/lib/mysql
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h localhost -p"$$MYSQL_ROOT_PASSWORD"']
      interval: 5s
      timeout: 5s
      retries: 20

  migrate-stg:
    image: ghcr.io/yk-graph/air-booking-migrator:staging
    container_name: air-booking-migrate-stg
    env_file:
      - .env.staging
    depends_on:
      db-stg:
        condition: service_healthy
    restart: 'no'
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  web-stg:
    image: ghcr.io/yk-graph/air-booking-web:staging
    container_name: air-booking-web-stg
    ports:
      - '127.0.0.1:4210:4000'
    env_file:
      - .env.staging
    environment:
      - NODE_ENV=production
    depends_on:
      db-stg:
        condition: service_healthy
      migrate-stg:
        condition: service_completed_successfully
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  air-booking-stg-mysql-data:
    name: air-booking-stg-mysql-data
