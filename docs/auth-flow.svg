<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="1200" viewBox="0 0 1340 1200" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1340" height="1200" fill="#f8fafc"/>
  <text x="40" y="40" font-size="23" font-weight="bold" fill="#0f172a">認証フロー（詳細）— いつ / どのテーブルに / どんな値が入るか</text>
  <text x="40" y="64" font-size="12" fill="#64748b">採用 = Stateful（DBセッション）。左=ユーザー/サーバーの動作、右=その時点の DB 操作（テーブルと値）。</text>

  <!-- Legend -->
  <g font-size="12">
    <rect x="40" y="80" width="14" height="14" fill="#ecfdf5" stroke="#16a34a"/><text x="60" y="91" fill="#166534">INSERT(新規)</text>
    <rect x="170" y="80" width="14" height="14" fill="#eff6ff" stroke="#3b82f6"/><text x="190" y="91" fill="#1e40af">SELECT(参照)</text>
    <rect x="300" y="80" width="14" height="14" fill="#fff7ed" stroke="#d97706"/><text x="320" y="91" fill="#9a3412">UPDATE(更新)</text>
    <rect x="430" y="80" width="14" height="14" fill="#fef2f2" stroke="#dc2626"/><text x="450" y="91" fill="#991b1b">DELETE(削除)</text>
    <rect x="560" y="80" width="14" height="14" fill="#f5f3ff" stroke="#7c3aed"/><text x="580" y="91" fill="#5b21b6">Cookie</text>
    <rect x="660" y="80" width="14" height="14" fill="#f1f5f9" stroke="#94a3b8"/><text x="680" y="91" fill="#475569">DB変更なし</text>
  </g>

  <!-- ============ Section 1: Signup + verify ============ -->
  <rect x="40" y="108" width="1260" height="28" rx="5" fill="#ede9fe"/>
  <text x="52" y="127" font-size="15" font-weight="bold" fill="#5b21b6">① サインアップ + メール確認</text>

  <!-- rows helper: left box x=50 w=560 ; right box x=650 w=650 -->
  <!-- S1 -->
  <g font-size="12.5">
    <rect x="50" y="146" width="560" height="44" rx="5" fill="#fff" stroke="#cbd5e1"/><rect x="50" y="146" width="7" height="44" fill="#6366f1"/>
    <text x="68" y="172"><tspan font-weight="bold">User</tspan>：email + password を入力（新規登録）</text>
    <rect x="650" y="146" width="650" height="44" rx="5" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="666" y="172" fill="#475569" font-family="Menlo,monospace" font-size="11.5">— DB 変更なし（送信のみ）</text>
  </g>
  <!-- S2 -->
  <g font-size="12.5">
    <rect x="50" y="200" width="560" height="44" rx="5" fill="#fff" stroke="#cbd5e1"/><rect x="50" y="200" width="7" height="44" fill="#f59e0b"/>
    <text x="68" y="226"><tspan font-weight="bold">Server</tspan>：password を bcrypt でハッシュ化（ソルト自動付与）</text>
    <rect x="650" y="200" width="650" height="44" rx="5" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="666" y="226" fill="#475569" font-family="Menlo,monospace" font-size="11.5">— 計算のみ / DB 変更なし</text>
  </g>
  <!-- S3 -->
  <g font-size="12.5">
    <rect x="50" y="254" width="560" height="44" rx="5" fill="#fff" stroke="#cbd5e1"/><rect x="50" y="254" width="7" height="44" fill="#f59e0b"/>
    <text x="68" y="280"><tspan font-weight="bold">Server→DB</tspan>：Account を作成</text>
    <rect x="650" y="254" width="650" height="44" rx="5" fill="#ecfdf5" stroke="#16a34a"/>
    <text x="666" y="280" fill="#166534" font-family="Menlo,monospace" font-size="11.5">INSERT Account { email, passwordHash, role=USER, emailVerifiedAt=null }</text>
  </g>
  <!-- S4 -->
  <g font-size="12.5">
    <rect x="50" y="308" width="560" height="44" rx="5" fill="#fff" stroke="#cbd5e1"/><rect x="50" y="308" width="7" height="44" fill="#14b8a6"/>
    <text x="68" y="334"><tspan font-weight="bold">Server→DB</tspan>：確認トークンを発行</text>
    <rect x="650" y="308" width="650" height="44" rx="5" fill="#ecfdf5" stroke="#16a34a"/>
    <text x="666" y="334" fill="#166534" font-family="Menlo,monospace" font-size="11.5">INSERT Token { accountId, type=EMAIL_VERIFICATION, hashedToken, expiresAt=+24h }</text>
  </g>
  <!-- S5 -->
  <g font-size="12.5">
    <rect x="50" y="362" width="560" height="52" rx="5" fill="#fff" stroke="#cbd5e1"/><rect x="50" y="362" width="7" height="52" fill="#ef4444"/>
    <text x="68" y="384"><tspan font-weight="bold">Resend→User</tspan>：確認リンク送信 → クリック</text>
    <text x="68" y="404" fill="#64748b" font-size="11.5">（生 token を URL に載せる）</text>
    <rect x="650" y="362" width="650" height="52" rx="5" fill="#fff7ed" stroke="#d97706"/>
    <text x="666" y="384" fill="#9a3412" font-family="Menlo,monospace" font-size="11">SELECT Token(hashedToken一致 &amp; 未期限 &amp; usedAt=null)</text>
    <text x="666" y="404" fill="#9a3412" font-family="Menlo,monospace" font-size="11">→ UPDATE Account.emailVerifiedAt=now / UPDATE Token.usedAt=now</text>
  </g>

  <!-- ============ Section 2: Login stateful ============ -->
  <rect x="40" y="432" width="1260" height="28" rx="5" fill="#dcfce7"/>
  <text x="52" y="451" font-size="15" font-weight="bold" fill="#166534">② ログイン（Stateful = 採用）</text>

  <!-- L1 -->
  <g font-size="12.5">
    <rect x="50" y="470" width="560" height="44" rx="5" fill="#fff" stroke="#cbd5e1"/><rect x="50" y="470" width="7" height="44" fill="#6366f1"/>
    <text x="68" y="496"><tspan font-weight="bold">User</tspan>：email + password を入力</text>
    <rect x="650" y="470" width="650" height="44" rx="5" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="666" y="496" fill="#475569" font-family="Menlo,monospace" font-size="11.5">— DB 変更なし（送信のみ）</text>
  </g>
  <!-- L2 -->
  <g font-size="12.5">
    <rect x="50" y="524" width="560" height="44" rx="5" fill="#fff" stroke="#cbd5e1"/><rect x="50" y="524" width="7" height="44" fill="#f59e0b"/>
    <text x="68" y="550"><tspan font-weight="bold">Server→DB</tspan>：email で Account を検索</text>
    <rect x="650" y="524" width="650" height="44" rx="5" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="666" y="550" fill="#1e40af" font-family="Menlo,monospace" font-size="11.5">SELECT Account WHERE email = ? → passwordHash を取得</text>
  </g>
  <!-- L3 -->
  <g font-size="12.5">
    <rect x="50" y="578" width="560" height="44" rx="5" fill="#fff" stroke="#cbd5e1"/><rect x="50" y="578" width="7" height="44" fill="#f59e0b"/>
    <text x="68" y="604"><tspan font-weight="bold">Server</tspan>：bcrypt.compare(入力, passwordHash)</text>
    <rect x="650" y="578" width="650" height="44" rx="5" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="666" y="604" fill="#475569" font-family="Menlo,monospace" font-size="11.5">— 照合(計算のみ) / DB 変更なし</text>
  </g>
  <!-- L4 -->
  <g font-size="12.5">
    <rect x="50" y="632" width="560" height="44" rx="5" fill="#fff" stroke="#cbd5e1"/><rect x="50" y="632" width="7" height="44" fill="#0ea5e9"/>
    <text x="68" y="658"><tspan font-weight="bold">Server→DB</tspan>：セッション作成（照合OK時）</text>
    <rect x="650" y="632" width="650" height="44" rx="5" fill="#ecfdf5" stroke="#16a34a"/>
    <text x="666" y="658" fill="#166534" font-family="Menlo,monospace" font-size="11.5">INSERT Session { accountId, hashedToken=sha256(token), expiresAt=+30d }</text>
  </g>
  <!-- L5 -->
  <g font-size="12.5">
    <rect x="50" y="686" width="560" height="44" rx="5" fill="#fff" stroke="#cbd5e1"/><rect x="50" y="686" width="7" height="44" fill="#8b5cf6"/>
    <text x="68" y="712"><tspan font-weight="bold">Browser</tspan>：Set-Cookie（session=生token, httpOnly）</text>
    <rect x="650" y="686" width="650" height="44" rx="5" fill="#f5f3ff" stroke="#7c3aed"/>
    <text x="666" y="712" fill="#5b21b6" font-family="Menlo,monospace" font-size="11.5">Cookie に保存（DBでなくブラウザ）。中身 = ただのID</text>
  </g>
  <!-- divider -->
  <text x="675" y="752" text-anchor="middle" font-size="12" fill="#64748b">━━━━━ 以降のリクエスト（毎回） ━━━━━</text>
  <!-- L6 -->
  <g font-size="12.5">
    <rect x="50" y="762" width="560" height="52" rx="5" fill="#ecfdf5" stroke="#16a34a"/><rect x="50" y="762" width="7" height="52" fill="#8b5cf6"/>
    <text x="68" y="784"><tspan font-weight="bold">Browser→Server</tspan>：Cookie 送信 → 照合</text>
    <text x="68" y="804" fill="#64748b" font-size="11.5">認証OK後 role で認可 / ログアウト時は削除</text>
    <rect x="650" y="762" width="650" height="52" rx="5" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="666" y="784" fill="#1e40af" font-family="Menlo,monospace" font-size="11">SELECT Session WHERE hashedToken=sha256(cookie) &amp; 未期限 → accountId</text>
    <text x="666" y="804" fill="#991b1b" font-family="Menlo,monospace" font-size="11">（ログアウト = DELETE Session WHERE id = ?）</text>
  </g>

  <!-- ============ Section 3: Password reset ============ -->
  <rect x="40" y="832" width="1260" height="28" rx="5" fill="#fee2e2"/>
  <text x="52" y="851" font-size="15" font-weight="bold" fill="#991b1b">③ パスワードリセット</text>

  <!-- R1 -->
  <g font-size="12.5">
    <rect x="50" y="870" width="560" height="44" rx="5" fill="#fff" stroke="#cbd5e1"/><rect x="50" y="870" width="7" height="44" fill="#6366f1"/>
    <text x="68" y="896"><tspan font-weight="bold">User</tspan>：email を入力（申請）※存在有無は返さない</text>
    <rect x="650" y="870" width="650" height="44" rx="5" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="666" y="896" fill="#475569" font-family="Menlo,monospace" font-size="11.5">— DB 変更なし（送信のみ）</text>
  </g>
  <!-- R2 -->
  <g font-size="12.5">
    <rect x="50" y="924" width="560" height="44" rx="5" fill="#fff" stroke="#cbd5e1"/><rect x="50" y="924" width="7" height="44" fill="#14b8a6"/>
    <text x="68" y="950"><tspan font-weight="bold">Server→DB</tspan>：リセットトークン発行</text>
    <rect x="650" y="924" width="650" height="44" rx="5" fill="#ecfdf5" stroke="#16a34a"/>
    <text x="666" y="950" fill="#166534" font-family="Menlo,monospace" font-size="11.5">INSERT Token { accountId, type=PASSWORD_RESET, hashedToken, expiresAt=+1h }</text>
  </g>
  <!-- R3 -->
  <g font-size="12.5">
    <rect x="50" y="978" width="560" height="44" rx="5" fill="#fff" stroke="#cbd5e1"/><rect x="50" y="978" width="7" height="44" fill="#ef4444"/>
    <text x="68" y="1004"><tspan font-weight="bold">Resend→User</tspan>：リンク送信 → 新パスワードを入力</text>
    <rect x="650" y="978" width="650" height="44" rx="5" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="666" y="1004" fill="#475569" font-family="Menlo,monospace" font-size="11.5">— DB 変更なし（送信のみ）</text>
  </g>
  <!-- R4 -->
  <g font-size="12.5">
    <rect x="50" y="1032" width="560" height="58" rx="5" fill="#fff" stroke="#cbd5e1"/><rect x="50" y="1032" width="7" height="58" fill="#f59e0b"/>
    <text x="68" y="1056"><tspan font-weight="bold">Server→DB</tspan>：token 照合 → 更新</text>
    <text x="68" y="1076" fill="#64748b" font-size="11.5">パスワード更新 + 全端末ログアウト</text>
    <rect x="650" y="1032" width="650" height="58" rx="5" fill="#fff7ed" stroke="#d97706"/>
    <text x="666" y="1052" fill="#9a3412" font-family="Menlo,monospace" font-size="11">SELECT Token(一致&amp;未期限&amp;未使用) → UPDATE Account.passwordHash</text>
    <text x="666" y="1070" fill="#9a3412" font-family="Menlo,monospace" font-size="11">UPDATE Token.usedAt=now</text>
    <text x="666" y="1084" fill="#991b1b" font-family="Menlo,monospace" font-size="11">DELETE Session WHERE accountId = ?（全セッション破棄）</text>
  </g>

  <!-- arrows action->db -->
  <g stroke="#cbd5e1" stroke-width="1.4" marker-end="url(#a)">
    <line x1="612" y1="168" x2="648" y2="168"/>
    <line x1="612" y1="222" x2="648" y2="222"/>
    <line x1="612" y1="276" x2="648" y2="276"/>
    <line x1="612" y1="330" x2="648" y2="330"/>
    <line x1="612" y1="388" x2="648" y2="388"/>
    <line x1="612" y1="492" x2="648" y2="492"/>
    <line x1="612" y1="546" x2="648" y2="546"/>
    <line x1="612" y1="600" x2="648" y2="600"/>
    <line x1="612" y1="654" x2="648" y2="654"/>
    <line x1="612" y1="708" x2="648" y2="708"/>
    <line x1="612" y1="788" x2="648" y2="788"/>
    <line x1="612" y1="892" x2="648" y2="892"/>
    <line x1="612" y1="946" x2="648" y2="946"/>
    <line x1="612" y1="1000" x2="648" y2="1000"/>
    <line x1="612" y1="1060" x2="648" y2="1060"/>
  </g>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#cbd5e1"/>
    </marker>
  </defs>
</svg>
